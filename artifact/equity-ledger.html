<title>Equity Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: fixed petrol sidebar cockpit + paper workspace; bottom tab bar on phones. Tokens carried over from the original Equity Ledger. */
:root {
  --bg: hsl(43 36% 94%); --fg: hsl(193 32% 18%); --card: hsl(42 42% 98%);
  --border: hsl(39 22% 83%); --primary: hsl(193 39% 25%); --primary-hover: hsl(193 39% 30%); --on-primary: hsl(43 45% 96%);
  --secondary: hsl(42 30% 89%); --muted: hsl(193 13% 45%);
  --accent: hsl(38 47% 57%); --accent-soft: hsl(38 47% 57% / .16); --destructive: hsl(4 55% 47%); --destructive-soft: hsl(4 55% 47% / .08);
  --positive: hsl(155 34% 35%); --positive-soft: hsl(155 34% 35% / .12);
  --sidebar: hsl(193 39% 25%); --sidebar-fg: hsl(43 45% 96%); --sidebar-dim: hsl(43 25% 78%); --sidebar-accent: hsl(193 32% 31%); --sidebar-line: hsl(193 22% 35%);
  --shadow: hsl(193 30% 25% / .04); --overlay: hsl(193 39% 15% / .35);
  --c1: #285762; --c2: #b88c4a; --c3: #90a6a2; --c4: #d9b875; --c5: #6f5a7e; --c6: #c9bfa8; --c7: #8a6a4a;
  --font-sans: 'Manrope', 'Segoe UI', system-ui, sans-serif; --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif; --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: hsl(193 34% 11%); --fg: hsl(43 35% 92%); --card: hsl(193 32% 15%); --border: hsl(193 20% 28%);
  --primary: hsl(38 47% 62%); --primary-hover: hsl(38 47% 68%); --on-primary: hsl(193 32% 14%); --secondary: hsl(193 25% 22%); --muted: hsl(43 15% 67%);
  --accent: hsl(38 47% 57%); --accent-soft: hsl(38 47% 57% / .18); --destructive: hsl(4 60% 62%); --destructive-soft: hsl(4 60% 62% / .12);
  --positive: hsl(155 38% 55%); --positive-soft: hsl(155 38% 55% / .14);
  --sidebar: hsl(193 38% 9%); --sidebar-fg: hsl(43 35% 92%); --sidebar-dim: hsl(43 18% 70%); --sidebar-accent: hsl(193 25% 18%); --sidebar-line: hsl(193 22% 21%);
  --shadow: hsl(0 0% 0% / .2); --overlay: hsl(193 40% 4% / .6);
  --c1: #6fa3ae; --c2: #d2a764; --c3: #a9bdb9; --c4: #e6c98c; --c5: #a990bb; --c6: #7d8a86; --c7: #c09a74;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: hsl(193 34% 11%); --fg: hsl(43 35% 92%); --card: hsl(193 32% 15%); --border: hsl(193 20% 28%);
  --primary: hsl(38 47% 62%); --primary-hover: hsl(38 47% 68%); --on-primary: hsl(193 32% 14%); --secondary: hsl(193 25% 22%); --muted: hsl(43 15% 67%);
  --accent: hsl(38 47% 57%); --accent-soft: hsl(38 47% 57% / .18); --destructive: hsl(4 60% 62%); --destructive-soft: hsl(4 60% 62% / .12);
  --positive: hsl(155 38% 55%); --positive-soft: hsl(155 38% 55% / .14);
  --sidebar: hsl(193 38% 9%); --sidebar-fg: hsl(43 35% 92%); --sidebar-dim: hsl(43 18% 70%); --sidebar-accent: hsl(193 25% 18%); --sidebar-line: hsl(193 22% 21%);
  --shadow: hsl(0 0% 0% / .2); --overlay: hsl(193 40% 4% / .6);
  --c1: #6fa3ae; --c2: #d2a764; --c3: #a9bdb9; --c4: #e6c98c; --c5: #a990bb; --c6: #7d8a86; --c7: #c09a74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; } button { cursor: pointer; } a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { min-height: 100dvh; display: flex; }
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 244px; padding: 28px 18px; display: flex; flex-direction: column; background: var(--sidebar); color: var(--sidebar-fg); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 12px 36px; text-decoration: none; }
.brand svg { width: 32px; height: 32px; color: var(--accent); flex: none; }
.brand-name { display: block; font-weight: 800; letter-spacing: -.04em; font-size: 15px; }
.brand-sub { display: block; color: var(--sidebar-dim); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; margin-top: 2px; }
.nav-label { padding: 0 12px 10px; color: var(--sidebar-dim); opacity: .8; text-transform: uppercase; letter-spacing: .15em; font: 500 10px var(--font-mono); }
.nav-list { display: grid; gap: 5px; }
.nav-link { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 10px; color: var(--sidebar-dim); font-size: 13px; text-decoration: none; border: 0; background: none; text-align: left; transition: background .2s, color .2s, transform .2s; }
.nav-link:hover { background: var(--sidebar-accent); color: var(--sidebar-fg); transform: translateX(2px); }
.nav-link.active { background: var(--sidebar-accent); color: var(--accent); box-shadow: inset 3px 0 var(--accent); }
.nav-link svg { width: 16px; height: 16px; flex: none; }
.sidebar-note { margin-top: auto; padding: 16px 14px; border: 1px solid var(--sidebar-line); border-radius: 12px; }
.sidebar-note p { margin: 8px 0 0; font: 600 13px/1.35 var(--font-serif); }
.sidebar-note small { display: block; margin-top: 8px; color: var(--sidebar-dim); font-size: 10px; line-height: 1.4; }
.sidebar-note svg { color: var(--accent); width: 17px; height: 17px; }

.main { width: calc(100% - 244px); margin-left: 244px; min-height: 100dvh; min-width: 0; }
.topbar { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 48px; border-bottom: 1px solid var(--border); }
.eyebrow { color: var(--muted); font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.topbar-date { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.topbar-date svg { width: 14px; height: 14px; color: var(--accent); }
.page { max-width: 1380px; margin: 0 auto; padding: 44px 48px 64px; }
.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
.page-heading h1 { margin: 5px 0 0; font: 600 clamp(34px, 4vw, 56px)/.96 var(--font-serif); letter-spacing: -.045em; color: var(--primary); text-wrap: balance; }
.page-heading h1:focus { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
.page-heading p { max-width: 520px; margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
.action-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.button { border: 0; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 15px; font-size: 12px; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s; }
.button:hover { transform: translateY(-2px); } .button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.button svg { width: 15px; height: 15px; }
.button-primary { color: var(--on-primary); background: var(--primary); } .button-primary:hover { background: var(--primary-hover); }
.button-secondary { color: var(--primary); background: var(--card); border: 1px solid var(--border); } .button-secondary:hover { background: var(--secondary); }
.button-danger { color: var(--destructive); background: var(--destructive-soft); }
.button-icon { width: 34px; height: 34px; padding: 0; color: var(--muted); background: transparent; border: 1px solid transparent; }
.button-icon:hover { color: var(--primary); background: var(--secondary); border-color: var(--border); transform: none; }

.overview-grid { display: grid; grid-template-columns: 1.35fr .85fr .85fr; gap: 16px; }
.stat-card { position: relative; overflow: hidden; min-height: 160px; padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 10px 30px var(--shadow); min-width: 0; }
.stat-card.dark { color: var(--on-primary); background: var(--primary); border-color: var(--primary); }
.stat-card.dark::after { content: ''; position: absolute; width: 200px; height: 200px; right: -60px; top: -80px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 50%; }
.stat-label { color: var(--muted); font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }
.stat-card.dark .stat-label, .stat-card.dark .stat-meta { color: color-mix(in srgb, var(--on-primary) 78%, transparent); }
.stat-value { margin-top: 15px; font-size: clamp(26px, 3vw, 42px); font-weight: 700; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.stat-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; color: var(--muted); font-size: 12px; }
.positive { color: var(--positive); } .negative { color: var(--destructive); }
.stat-card.dark .positive, .stat-card.dark .negative { color: inherit; font-weight: 700; }

.section-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; margin-top: 16px; }
.section-grid > * { min-width: 0; }
.panel { border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 10px 30px var(--shadow); min-width: 0; }
.panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 22px 24px 10px; }
.panel-title { margin: 0; font: 600 21px var(--font-serif); letter-spacing: -.02em; color: var(--primary); }
.panel-kicker { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
.panel-body { padding: 12px 24px 24px; }
.stack { display: grid; gap: 16px; }

.allocation-layout { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
.donut { flex: 0 0 176px; width: 176px; height: 176px; position: relative; border-radius: 50%; }
.donut::after { content: ''; position: absolute; inset: 25px; border-radius: 50%; background: var(--card); }
.donut-center { position: absolute; z-index: 1; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-center strong { font-size: 22px; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.donut-center span { margin-top: 3px; color: var(--muted); font: 10px var(--font-mono); text-transform: uppercase; }
.legend { flex: 1; min-width: 180px; display: grid; gap: 12px; }
.legend-row { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 10px; font-size: 12px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-row span { color: var(--muted); }
.legend-row strong, .legend-row em { font: 500 11px var(--font-mono); font-style: normal; font-variant-numeric: tabular-nums; }
.legend-row em { color: var(--muted); }
.mix-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--secondary); margin: 6px 0 14px; }

.activity-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: 0; }
.activity-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); background: var(--accent-soft); }
.activity-mark svg { width: 14px; height: 14px; }
.activity-item strong { display: block; font-size: 12px; } .activity-item p { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
.activity-time { color: var(--muted); font: 10px var(--font-mono); white-space: nowrap; }

.callout { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 16px; padding: 19px 22px; color: var(--on-primary); background: var(--primary); border-radius: 14px; }
.callout-copy { display: flex; gap: 13px; align-items: flex-start; } .callout-copy svg { flex: none; margin-top: 2px; width: 18px; height: 18px; }
.callout strong { display: block; font: 600 19px var(--font-serif); } .callout p { margin: 4px 0 0; opacity: .8; font-size: 12px; line-height: 1.5; }
.callout .button { background: var(--accent); color: hsl(193 32% 14%); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { padding: 12px 18px; text-align: left; color: var(--muted); background: color-mix(in srgb, var(--secondary) 45%, transparent); font: 500 10px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
td { padding: 14px 18px; border-top: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
th.r, td.r { text-align: right; }
tr.data-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.ticker-cell { display: flex; align-items: center; gap: 10px; }
.ticker-mark { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--primary); background: var(--secondary); border-radius: 9px; font: 600 10px var(--font-mono); }
.ticker-cell strong { display: block; font-size: 12px; } .ticker-cell span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
.mono { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; padding: 5px 7px; border-radius: 5px; color: var(--primary); background: var(--accent-soft); font: 500 10px var(--font-mono); white-space: nowrap; }
.row-actions { display: flex; justify-content: flex-end; gap: 2px; }
.price-source { display: block; margin-top: 4px; color: var(--muted); font: 9px var(--font-mono); white-space: nowrap; }

.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.status-active, .status-live, .status-within, .status-steady { color: var(--positive); background: var(--positive-soft); }
.status-paused, .status-manual, .status-unconfigured, .status-information { color: var(--muted); background: var(--secondary); }
.status-completed, .status-watch { color: var(--primary); background: var(--accent-soft); }
.status-failed, .status-material, .status-above, .status-below, .status-rebalance { color: var(--destructive); background: var(--destructive-soft); }

.empty-state { padding: 48px 24px; text-align: center; }
.empty-state svg { width: 26px; height: 26px; margin: 0 auto 12px; color: var(--accent); }
.empty-state h3 { margin: 0; font: 600 21px var(--font-serif); color: var(--primary); }
.empty-state p { max-width: 380px; margin: 8px auto 18px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.empty-state .action-row { justify-content: center; }
.skeleton { background: linear-gradient(90deg, var(--secondary), var(--card), var(--secondary)); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }

.market-status { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: -8px 0 18px; padding: 10px 13px; color: var(--muted); background: color-mix(in srgb, var(--secondary) 55%, transparent); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; line-height: 1.5; }
.market-status svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
.market-status.warning { background: var(--destructive-soft); border-color: color-mix(in srgb, var(--destructive) 25%, transparent); color: var(--fg); }
.example-banner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 10px; font-size: 12px; color: var(--fg); background: var(--accent-soft); }

.modal-overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(2px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px 16px; animation: fade .2s ease; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 560px; max-height: calc(100dvh - 40px); overflow-y: auto; animation: rise .3s cubic-bezier(.16,1,.3,1); }
@keyframes fade { from { opacity: 0; } } @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.modal-title { margin: 0; font: 600 24px var(--font-serif); color: var(--primary); letter-spacing: -.02em; }
.modal-desc { margin: 6px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 7px; min-width: 0; } .field.full { grid-column: 1 / -1; }
.field label { color: var(--primary); font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--bg); font-size: 13px; }
.field textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field small { color: var(--muted); font-size: 11px; line-height: 1.4; }
.form-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.form-error, .error-box { padding: 12px 14px; color: var(--destructive); background: var(--destructive-soft); border: 1px solid color-mix(in srgb, var(--destructive) 22%, transparent); border-radius: 8px; font-size: 12px; line-height: 1.5; }
.form-error { margin-top: 14px; }

.account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 22px; }
.account-card { padding: 17px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); min-width: 0; }
.account-card h3 { margin: 12px 0 3px; font: 600 18px var(--font-serif); color: var(--primary); }
.account-card p { margin: 0; color: var(--muted); font-size: 11px; }
.account-value { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--border); }
.account-value strong { font-size: 18px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 28px 0 14px; }
.section-heading h2 { margin: 0; font: 600 22px var(--font-serif); color: var(--primary); }

.schedule-card { display: grid; grid-template-columns: auto 1fr auto auto; gap: 18px; align-items: center; padding: 16px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.schedule-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; color: var(--primary); background: var(--secondary); }
.schedule-icon svg { width: 18px; height: 18px; }
.schedule-details { min-width: 0; } .schedule-details strong { display: block; font-size: 15px; color: var(--primary); font-weight: 600; margin-bottom: 3px; }
.schedule-details span { color: var(--muted); font-size: 12px; }
.schedule-meta { text-align: right; } .schedule-meta strong { display: block; font-family: var(--font-mono); font-size: 14px; } .schedule-meta span { color: var(--muted); font-size: 11px; }
.schedule-fail { grid-column: 2 / -1; font-size: 11px; color: var(--destructive); }

.advisor-answer { display: grid; gap: 14px; }
.advisor-answer h3 { margin: 0; font: 600 24px/1.15 var(--font-serif); color: var(--primary); text-wrap: balance; }
.advisor-answer ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; line-height: 1.55; font-size: 13px; }
.advisor-answer .risk-note { font-size: 11px; color: var(--muted); line-height: 1.5; padding-top: 10px; border-top: 1px solid var(--border); }
.answer-label { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.prompt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 99px; padding: 7px 11px; font-size: 11px; color: var(--primary); }
.chip:hover { border-color: var(--accent); }
.flag { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.flag:last-child { border-bottom: 0; } .flag strong { font-size: 13px; } .flag p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.lede { margin: 0; font: 500 17px/1.6 var(--font-serif); color: var(--fg); max-width: 72ch; }
.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.index-tile { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); min-width: 0; }
.index-tile span { color: var(--muted); font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.index-tile strong { font-size: 17px; letter-spacing: -.02em; } .index-tile em { font: 500 11px var(--font-mono); font-style: normal; }
.focus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.focus-card { display: grid; align-content: start; gap: 8px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); min-width: 0; }
.focus-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.focus-n { font: 600 22px/1 var(--font-serif); color: var(--accent); }
.focus-card h3 { margin: 0; font: 600 18px/1.25 var(--font-serif); color: var(--primary); text-wrap: balance; }
.focus-card p { margin: 0; color: var(--fg); font-size: 12.5px; line-height: 1.6; }
.risk-line { margin: 14px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.news-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.news-list { display: grid; gap: 0; }

  if (!caps.mcp) { if (manual) toast('Live prices are not available in this view. Edit prices by hand instead.'); return; }
  if (market.refreshing) return;
  if (market.radar && !market.radarError && Date.now() - market.lastRefreshAt < 60_000) { if (manual) toast('Prices were refreshed under a minute ago.'); return; }
  market.refreshing = true; market.lastRefreshAt = Date.now(); render();
  const failures = []; let updated = 0;
  try {
    try { market.radar = await fetchCmcRadar(); market.radarAt = new Date().toISOString(); market.radarError = null; store.set('el.mcp', '1'); }
    catch (e) { market.radarError = `CoinMarketCap: ${mcpErrorText(e)}`; }
    const fx = fxToGbp(state);
    const live = state.holdings.filter((h) => !isManuallyValued(h));
    for (const h of live) {
      try {
        const sym = h.ticker.toUpperCase().split('-')[0];
        const q = (market.radarAt && market.radar?.find((i) => i.symbol === sym)) || await fetchCmcQuote(h);
        if (q.cmcId && !h.cmcId) h.cmcId = q.cmcId;
        const priceInCur = (q.price * fx.USD) / fx[h.currency];
        Object.assign(h, { price: round(priceInCur, 6), referencePrice: h.referencePrice ?? round(priceInCur, 6), dayChange: round(q.dayChange, 4), priceUpdatedAt: q.timestamp, priceSource: 'CoinMarketCap', priceError: null, updatedAt: new Date().toISOString() });
        evaluateAlerts(state, h); updated += 1;
      } catch (e) {
        h.priceError = mcpErrorText(e); failures.push(`${h.ticker}: ${h.priceError}`);
      }
    }
    if (live.length) logActivity(state, failures.length ? 'Market refresh partly completed' : 'Market prices refreshed', failures.length ? `${updated} holdings updated; ${failures.length} quotes failed` : `${updated} crypto holdings updated`, 'market');
    if (live.length) save();
    if (manual) toast(failures.length ? `${updated} updated, ${failures.length} failed.` : 'Live prices refreshed.');
  } catch (e) {
    market.radarError = mcpErrorText(e);
    if (manual) toast(market.radarError);
  } finally { market.refreshing = false; render(); }
}
const isFatalMcp = (e) => ['not_granted', 'not_in_manifest', 'server_not_connected', 'needs_reauth', 'blocked_by_policy', 'capability_disabled', 'revoked'].includes(e?.code);
function mcpErrorText(e) {
  switch (e?.code) {
    case 'not_granted': return 'access was not allowed for this page.';
    case 'server_not_connected': case 'server_not_found': return 'not connected in your claude.ai connectors.';
    case 'needs_reauth': return 'needs reconnecting in your claude.ai connectors.';
    case 'tool_error': return 'no USD market for this symbol.';
    case 'server_unavailable': return 'unreachable right now.';
    default: return e?.message && !e.code ? e.message : 'Live quote unavailable.';
  }
}

const emptyState = () => ({

  fx: { USD: { rate: DEFAULT_FX.USD, updatedAt: null }, EUR: { rate: DEFAULT_FX.EUR, updatedAt: null } },
  targets: { assetClassRanges: [], concentrationLimit: 20, knownAnnualFeePercent: null, knownPlatformCostAmount: null, knownPlatformCostCurrency: null, knownPlatformCostFrequency: null, knownPlatformCostNotes: null, knownDealingCostAmount: null, knownDealingCostCurrency: null, knownDealingCostNotes: null, liquidityHorizonDays: null, liquidityNotes: null, updatedAt: null },

function logActivity(s, title, detail, kind) { s.activity.unshift({ id: newId(), title, detail, kind, timestamp: new Date().toISOString() }); s.activity = s.activity.slice(0, 60); }
const portfolioRef = () => caps.db.collection(`data/users/${caps.uid}`).doc('portfolio');

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    // Store the calculated loan figures too, so the briefing job can read them.
    state.liabilities.forEach((l) => { const m = loanMetrics(l, state); l.estimates = { settlementGbp: m.settlement, earlyRepaymentChargeGbp: m.earlyCharge, earlyRepaymentChargeSource: m.earlyChargeSource || null, monthlyPaymentGbp: m.payment ? round(m.payment) : null, paymentsLeft: m.paymentsLeft, finalPaymentMonth: m.projectedEnd || m.endMonth, totalRepayableGbp: m.totalRepayable, totalInterestGbp: m.totalInterest, estimatedBorrowedGbp: m.borrowed, termMonths: m.termMonths, paymentsMade: m.paymentsMade ?? null, paidSoFarGbp: m.paidSoFar, interestPaidGbp: m.interestPaid, interestRemainingGbp: m.interestRemaining, futureInterestGbp: m.interestSaved }; });
    const json = JSON.stringify(state);
    if (json === lastSavedJson) return;
    saving = saving.then(async () => {
      try { await portfolioRef().set(JSON.parse(json)); lastSavedJson = json; }
      catch (e) { handleDbError(e, 'Your change could not be saved.'); }
    });

}
function handleDbError(e, fallback) {
  if (e?.code === 'revoked') { phase = 'expired'; render(); return; }
  if (e?.code === 'quota_exceeded') { toast('Storage for this ledger is full. Delete older saved reviews to make room.'); return; }
  toast(fallback);
}
function hydrate(data) {
  const base = emptyState();
  // Store snapshots are frozen; work on a deep, writable copy.
  const s = { ...base, ...(data ? JSON.parse(JSON.stringify(data)) : {}) };
  for (const k of ['holdings', 'accounts', 'liabilities', 'schedules', 'occurrences', 'alerts', 'activity']) if (!Array.isArray(s[k])) s[k] = [];
  s.fx = { ...base.fx, ...(s.fx || {}) }; s.targets = { ...base.targets, ...(s.targets || {}) };
  s.liabilities.forEach((l) => { if (!l.endMonth) l.endMonth = parseEndMonth(l.due); delete l.settlementGbp; delete l.settlementEstimated; delete l.settlementUpdatedAt;
    // Earlier versions called this field 'amount borrowed'; people entered the original total including interest.
    if (Number(l.borrowedGbp) > 0 && !(Number(l.originalTotalGbp) > 0)) l.originalTotalGbp = Number(l.borrowedGbp);
    delete l.borrowedGbp; });
  return s;
}

const BRIEFING_TRIGGER_ID = 'trig_01FQeDcQ7SeoFPzfD44sMhWA';
const NEWS_SOURCES = [
  { name: 'Yahoo Finance', domains: ['yahoo.com'] },

  { name: 'Forbes', domains: ['forbes.com'] },
];
const sourceFor = (url) => { const h = hostOf(url); return NEWS_SOURCES.find((s) => s.domains.some((d) => h === d || h.endsWith(`.${d}`))) || null; };
const briefingUi = { doc: null, loaded: false, publisher: 'all', requesting: false, requestedAt: Number(store.get('el.briefingRequestedAt')) || 0, error: null };
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === 'https:' && !x.username && !x.password ? x.toString() : null; } catch { return null; } };
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
function cleanItems(items) {
  return (Array.isArray(items) ? items : []).map((i) => { const url = safeUrl(i?.url); const src = url && sourceFor(url);
    return { title: String(i?.title || '').slice(0, 300), publisher: src ? src.name : '', url, publishedAt: typeof i?.publishedAt === 'string' ? i.publishedAt : null, summary: String(i?.summary || '').slice(0, 500) }; })
    .filter((i) => i.title && i.url && i.publisher);
}
function briefingData() {
  const d = briefingUi.doc; if (!d) return null;
  return {
    generatedAt: d.generatedAt || null,
    market: d.market && typeof d.market === 'object' ? { headline: String(d.market.headline || ''), summary: String(d.market.summary || ''), asOf: d.market.asOf || null,
      indices: (Array.isArray(d.market.indices) ? d.market.indices : []).filter((i) => i && i.name && (Number.isFinite(Number(i.level)) && i.level !== null || Number.isFinite(Number(i.changePct)) && i.changePct !== null)).slice(0, 16).map((i) => ({ name: String(i.name), level: Number.isFinite(Number(i.level)) && i.level !== null ? Number(i.level) : null, changePct: Number.isFinite(Number(i.changePct)) && i.changePct !== null ? Number(i.changePct) : null })),
      drivers: (Array.isArray(d.market.drivers) ? d.market.drivers : []).map(String).slice(0, 8) } : null,
    holdingsNews: (Array.isArray(d.holdingsNews) ? d.holdingsNews : []).map((g) => ({ ticker: String(g?.ticker || '').toUpperCase(), name: String(g?.name || ''), items: cleanItems(g?.items) })).filter((g) => g.ticker),
    generalNews: cleanItems(d.generalNews),
    focusAreas: (Array.isArray(d.focusAreas) ? d.focusAreas : []).map((f) => ({ title: String(f?.title || ''), rationale: String(f?.rationale || ''), type: ['portfolio', 'market', 'research'].includes(f?.type) ? f.type : 'research', relatedTickers: Array.isArray(f?.relatedTickers) ? f.relatedTickers.map(String) : [] }))
      .filter((f) => f.title && !containsProhibitedInstrument(`${f.title} ${f.rationale}`) && !/\bprice\s+target\b|\bwill\s+(?:rise|fall|double|surge|crash)\b|\bguaranteed?\b/i.test(`${f.title} ${f.rationale}`)).slice(0, 6),
    riskNote: String(d.riskNote || 'This briefing is educational information, not regulated personal advice.'),

  };
}
async function requestBriefing() {

  briefingUi.requesting = true; briefingUi.error = null; render();
  try {
    await caps.remote.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: BRIEFING_TRIGGER_ID });
    briefingUi.requestedAt = Date.now(); store.set('el.briefingRequestedAt', String(briefingUi.requestedAt));

  } finally { briefingUi.requesting = false; render(); }
}

function fearGreedGauge(index, label) {

  const arc = (a, b, color) => { const [x1, y1] = pt(a, 80); const [x2, y2] = pt(b, 80); return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A80 80 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="16" fill="none" stroke-linecap="butt"/>`; };
  const [nx, ny] = pt(index, 62);
  return `<svg class="fg-gauge" viewBox="0 0 200 118" role="img" aria-label="Fear and Greed ${index} of 100, ${esc(label)}">
    ${arc(0, 24.5, 'var(--destructive)')}${arc(25.5, 44.5, 'var(--c2)')}${arc(45.5, 54.5, 'var(--c6)')}${arc(55.5, 74.5, 'var(--c3)')}${arc(75.5, 100, 'var(--positive)')}
    <line x1="100" y1="100" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--fg)"/>
    <text x="14" y="116" font-size="9" fill="var(--muted)" font-family="DM Mono, monospace">0</text><text x="178" y="116" font-size="9" fill="var(--muted)" font-family="DM Mono, monospace">100</text></svg>`;
}

let modalEl = null;
function openModal(html, onSubmit) {
  closeModal();

  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(modalEl);
  const form = modalEl.querySelector('form');
  if (form) form.addEventListener('submit', (e) => { e.preventDefault(); try { const err = onSubmit(form); if (err) showFormError(err); else closeModal(); } catch (ex) { showFormError(ex.message); } });
  modalEl.addEventListener('mousedown', (e) => { if (e.target === modalEl) closeModal(); });
  modalEl.querySelector('input, select, textarea, button')?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

    case 'request-briefing': requestBriefing(); break;
    case 'load-cmc': loadCmc({ manual: true }); break;
    case 'news-publisher': briefingUi.publisher = el.dataset.pub; render(); break;
    case 'load-examples': loadExamples(); break;
    case 'clear-examples': clearExamples(); break;
  }
});
document.addEventListener('toggle', (e) => { if (e.target.classList?.contains('crypto-panel')) store.set('el.cryptoOpen', e.target.open ? '1' : '0'); }, true);
function afterRender(r) {
  if ((r === 'news' || r === 'overview') && caps.mcp && !cmc.loading && !cmc.fetchedAt) setTimeout(() => loadCmc(), 0);
  if (r === 'news' && caps.mcp && !market.radar && !market.refreshing && !market.lastRefreshAt) setTimeout(() => refreshMarket(), 0);
}

let toastTimer = null;
function toast(message) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = message; document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3800);
}

/* =========================================================================
   Boot
   ========================================================================= */
(async function boot() {
  const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, sample, mcp] = await Promise.all([use('db'), use('user'), use('sample'), use('mcp')]);
  Object.assign(caps, { db, user, sample, mcp, remote: mcp });
  caps.uid = user ? await user.id().catch(() => null) : null;
  if (!db || !caps.uid) { phase = 'landing'; render(); return; }
  try {
    const snap = await portfolioRef().get();
    state = hydrate(snap.exists ? snap.data() : null);
    lastSavedJson = snap.exists ? JSON.stringify(snap.data()) : '';
  } catch (e) {
    if (e?.code === 'revoked') { phase = 'expired'; render(); return; }
    state = hydrate(null);
  }
  await loadSnapshots();
  phase = 'app';
  const r = processDueSchedules(state);
  if (r.applied || r.failed) save();
  render();
  if (r.applied || r.failed) toast(`Recurring: ${r.applied} applied${r.failed ? `, ${r.failed} failed` : ''}.`);
  portfolioRef().onSnapshot((snapDoc) => {
    if (!snapDoc.exists || snapDoc.metadata.hasPendingWrites) return;
    const json = JSON.stringify(snapDoc.data());
    if (json === lastSavedJson || json === JSON.stringify(state)) return;
    lastSavedJson = json; state = hydrate(snapDoc.data()); if (!modalEl) render();
  }, (e) => { if (e?.code === 'revoked') { phase = 'expired'; render(); } });
  caps.db.collection(`data/users/${caps.uid}`).doc('briefing').onSnapshot((d) => {
    briefingUi.loaded = true; briefingUi.doc = d.exists ? d.data() : null;
    if (!modalEl && route() === 'news') render();
  }, () => { briefingUi.loaded = true; });
  if (store.get('el.mcp') === '1' && caps.mcp) refreshMarket();
})();
</script>
